spring:
  application:
    name: calendar-service


---
spring:
  config:
    activate:
      on-profile: dev

    import: optional:configserver:http://${username}:${password}@localhost:9000
  kafka:
    bootstrap-servers: localhost:9092
websocket:
  url: http://localhost:8580

logging:
  config: classpath:logback-dev.xml

mailgun:
  api-key: ${mailgun.api.key}
  url: https://api.mailgun.net/v3
---

spring:

  config:
    activate:
      on-profile: live

    import: "aws-secretsmanager:/secret/calendar,optional:configserver:http://${secrets.username}:${secrets.password}@config-server:9000"


logging:
  config: classpath:logback-live.xml

